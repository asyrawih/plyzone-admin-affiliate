<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KLSM Affiliate</title>
    <meta name="description" content="Program afiliasi KLSM: ajak teman main lewat share link Roblox, dapat komisi dari setiap Robux dan donasi yang mereka belanjakan." />
    <script>try{var t=localStorage.getItem("klsm-theme");var d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark");document.documentElement.style.colorScheme=d?"dark":"light"}catch(e){}</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
