# Traefik bawaan k3s + cert-manager (ClusterIssuer "letsencrypt-prod"). Lihat README untuk pasang cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: klsm-affiliate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["affiliate.GANTI-DOMAIN.com"]
      secretName: klsm-affiliate-tls
  rules:
    - host: affiliate.GANTI-DOMAIN.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: klsm-affiliate
                port: { name: http }
