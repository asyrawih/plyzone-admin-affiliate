# JANGAN commit versi asli. deploy.sh membuat keduanya dari .env:
#   kubectl -n klsm-affiliate create secret generic klsm-postgres \
#     --from-literal=POSTGRES_USER=klsm --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" --from-literal=POSTGRES_DB=klsm
#   kubectl -n klsm-affiliate create secret generic klsm-affiliate-secrets \
#     --from-literal=DATABASE_URL="postgres://klsm:<password>@klsm-postgres:5432/klsm" \
#     --from-literal=WEBHOOK_SHARED_SECRET="$(openssl rand -hex 24)" --from-literal=WEBHOOK_HMAC_SECRET=""
apiVersion: v1
kind: Secret
metadata:
  name: klsm-affiliate-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://klsm:ganti-password@klsm-postgres:5432/klsm"
  WEBHOOK_SHARED_SECRET: "ganti-dengan-random"
  WEBHOOK_HMAC_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: klsm-postgres
type: Opaque
stringData:
  POSTGRES_USER: "klsm"
  POSTGRES_PASSWORD: "ganti-password"
  POSTGRES_DB: "klsm"
