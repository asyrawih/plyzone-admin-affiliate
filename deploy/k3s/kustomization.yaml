apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: klsm-affiliate
resources:
  - namespace.yaml
  - postgres.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  # pvc.yaml (SQLite lama) dan migrate-job.yaml SENGAJA tidak di sini: apply manual saat cutover, hapus setelah fase D.
# Secret dibuat deploy.sh dari .env (klsm-affiliate-secrets: DATABASE_URL, WEBHOOK_*; klsm-postgres: POSTGRES_*).
images:
  - name: klsm-affiliate
    newName: ghcr.io/GANTI-USER/klsm-affiliate
    newTag: latest
